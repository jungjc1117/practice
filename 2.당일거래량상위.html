<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>키움증권 당일거래량상위 (코스피/코스닥) CSV 다운로드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4"
  >
    <!-- Main Container -->
    <div
      class="max-w-xl w-full bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden"
    >
      <!-- Header -->
      <div
        class="bg-slate-800/80 p-6 border-b border-slate-700 flex items-center space-x-4"
      >
        <div
          class="p-3 bg-red-600/20 border border-red-500/30 rounded-xl text-red-500"
        >
          <i data-lucide="file-spread-sheet" class="w-8 h-8"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white">
            당일거래량상위 CSV 다운로더
          </h1>
          <p class="text-xs text-slate-400 mt-1">
            코스피(k) + 코스닥(q) 순차 수집 및 통합 extraction
          </p>
        </div>
      </div>

      <!-- Main Content Body -->
      <div class="p-6 space-y-6">
        <!-- Execution Button -->
        <div>
          <button
            id="runBtn"
            onclick="executeWorkflow()"
            class="w-full py-4 px-6 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 active:scale-[0.99] text-white font-bold text-base rounded-xl shadow-lg shadow-red-900/30 transition-all flex items-center justify-center space-x-3 cursor-pointer"
          >
            <i data-lucide="download" class="w-5 h-5"></i>
            <span>당일거래상위 (KOSPI/KOSDAQ) CSV 다운로드</span>
          </button>
        </div>

        <!-- Log / Status Box -->
        <div
          class="bg-slate-950 rounded-xl border border-slate-800 p-4 font-mono text-xs text-slate-300"
        >
          <div
            class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800"
          >
            <span
              class="text-slate-400 font-semibold flex items-center space-x-2"
            >
              <i data-lucide="terminal" class="w-4 h-4 text-emerald-400"></i>
              <span>실행 상태 로그</span>
            </span>
            <span
              id="statusBadge"
              class="px-2 py-0.5 text-[10px] rounded bg-slate-800 text-slate-400"
              >대기 중</span
            >
          </div>
          <div
            id="logArea"
            class="h-56 overflow-y-auto space-y-1.5 text-[11px] leading-relaxed"
          >
            <div class="text-slate-500">
              '당일거래상위' 버튼을 누르면 코스피/코스닥 조회를 시작합니다.
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
      // Lucide Icons Initialization
      lucide.createIcons();

      // 헬퍼: 딜레이 함수 (밀리초)
      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      // Safe integer conversion helper (부호 포함)
      function toSafeInt(val) {
        if (val === undefined || val === null) return 0;
        // 콤마, 공백 제거 후 수치 파싱 (부호 유지)
        const cleanStr = String(val).replace(/[^0-9-]/g, "");
        const parsed = parseInt(cleanStr, 10);
        return isNaN(parsed) ? 0 : parsed;
      }

      // Utility: Get YYYYMMDD Format
      function getFormattedDate() {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");
        return `${year}${month}${day}`;
      }

      // Logging Function
      function log(msg, type = "info") {
        const logArea = document.getElementById("logArea");
        const entry = document.createElement("div");
        const now = new Date().toLocaleTimeString();

        let color = "text-slate-300";
        if (type === "error") color = "text-red-400 font-semibold";
        if (type === "success") color = "text-emerald-400 font-semibold";
        if (type === "warn") color = "text-amber-400";

        entry.className = color;
        entry.innerHTML = `<span class="text-slate-600">[${now}]</span> ${msg}`;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
        console.log(msg);
      }

      function resetLog() {
        document.getElementById("logArea").innerHTML = "";
      }

      // 1. 접근토큰 발급 (fn_au10001)
      async function fn_au10001(data) {
        const host = "https://mockapi.kiwoom.com"; // 모의투자
        const endpoint = "/oauth2/token";
        const url = host + endpoint;

        const headers = {
          "Content-Type": "application/json;charset=UTF-8",
        };

        log("1. 접근토큰 발급 요청 중...");

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: headers,
            body: JSON.stringify(data),
          });

          const responseBody = await response.json();

          // 키움 API 특성: return_code가 0, '0', '0000', 또는 undefined일 경우 정상
          const code = responseBody.return_code;
          if (
            code !== undefined &&
            code !== 0 &&
            code !== "0" &&
            code !== "0000"
          ) {
            throw new Error(
              responseBody.return_msg || responseBody.msg || "토큰 발급 실패",
            );
          }

          const token = responseBody.access_token || responseBody.token;
          if (token) {
            log(" -> 접근토큰 발급 성공!", "success");
            return token;
          } else {
            throw new Error("응답 바디에 Access Token이 없습니다.");
          }
        } catch (error) {
          console.error("요청 실패:", error);
          log(` -> 토큰 발급 실패: ${error.message}`, "error");
          throw error;
        }
      }

      // 2. 당일거래량상위요청 (fn_ka10030)
      async function fn_ka10030(token, data, cont_yn = "N", next_key = "") {
        const host = "https://mockapi.kiwoom.com"; // 모의투자
        const endpoint = "/api/dostk/rkinfo";
        const url = host + endpoint;

        const headers = {
          "Content-Type": "application/json;charset=UTF-8",
          authorization: `Bearer ${token}`,
          "cont-yn": cont_yn,
          "next-key": next_key,
          "api-id": "ka10030",
        };

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: headers,
            body: JSON.stringify(data),
          });

          // 헤더 응답에서 cont-yn, next-key 추출
          const resContYn =
            response.headers.get("cont-yn") ||
            response.headers.get("Cont-Yn") ||
            "N";
          const resNextKey =
            response.headers.get("next-key") ||
            response.headers.get("Next-Key") ||
            "";

          const responseBody = await response.json();

          const code = responseBody.return_code;
          if (
            code !== undefined &&
            code !== 0 &&
            code !== "0" &&
            code !== "0000"
          ) {
            throw new Error(
              responseBody.return_msg ||
                responseBody.msg ||
                "TR 데이터 조회 실패",
            );
          }

          return {
            body: responseBody,
            contYn: resContYn,
            nextKey: resNextKey,
          };
        } catch (error) {
          console.error("요청 실패:", error);
          log(` -> TR 요청 실패: ${error.message}`, "error");
          throw error;
        }
      }

      // 시장별(코스피 / 코스닥) 연속조회 수집 함수
      async function collectMarketData(token, mrktTpCode, mrktLabel) {
        log(
          `\n--- [${mrktLabel.toUpperCase()} (mrkt_tp: ${mrktTpCode})] 수집 시작 ---`,
          "warn",
        );

        const baseTrParams = {
          mrkt_tp: mrktTpCode,
          sort_tp: "1",
          mang_stk_incls: "0",
          crd_tp: "0",
          trde_qty_tp: "0",
          pric_tp: "0",
          trde_prica_tp: "0",
          mrkt_open_tp: "0",
          stex_tp: "3",
        };

        let marketDataList = [];
        let contYn = "N";
        let nextKey = "";
        let page = 1;

        while (true) {
          log(`[${mrktLabel}] 데이터 요청 중... (${page}번째 페이지)`);
          const result = await fn_ka10030(token, baseTrParams, contYn, nextKey);

          const pageList = result.body.tdy_trde_qty_upper || [];

          // 각 레코드에 mrkt_tp 필드 "k" 또는 "q" 로 추가 지정
          const processedList = pageList.map((item) => ({
            ...item,
            mrkt_tp: mrktLabel,
          }));

          marketDataList = marketDataList.concat(processedList);

          log(
            ` -> [${mrktLabel}] ${page}페이지 수신완료: ${pageList.length}건 (누적: ${marketDataList.length}건)`,
            "success",
          );

          contYn = result.contYn;
          nextKey = result.nextKey;

          if (contYn !== "Y" || !nextKey) {
            log(
              ` -> [${mrktLabel}] 추가 데이터가 없으므로 조회를 완료합니다.`,
              "info",
            );
            break;
          }

          page++;
          log(` -> 1초 대기 후 [${mrktLabel}] 다음 연속조회를 실행합니다...`);
          await delay(1000);
        }

        return marketDataList;
      }

      // 3. CSV 생성 및 다운로드 (열: mrkt_tp, stk_cd, cur_prc, trde_qty)
      function createAndDownloadCSV(dataList) {
        log("\n3. CSV 변환 및 다운로드 실행 중...");

        // 지정된 4개 열
        const headers = ["mrkt_tp", "stk_cd", "cur_prc", "trde_qty"];
        let csvRows = [headers.join(",")];

        dataList.forEach((item) => {
          // 가격의 부호 제거 및 정수 변환
          const curPrc = Math.abs(toSafeInt(item.cur_prc));
          const trdeQty = Math.abs(toSafeInt(item.trde_qty));

          const row = [
            `"${item.mrkt_tp.replace(/"/g, '""')}"`,
            `"${item.stk_cd.replace(/"/g, '""')}"`,
            curPrc,
            trdeQty,
          ];
          csvRows.push(row.join(","));
        });

        // UTF-8 BOM 추가 (Excel 한글 깨짐 방지)
        const csvContent = "\uFEFF" + csvRows.join("\r\n");
        const blob = new Blob([csvContent], {
          type: "text/csv;charset=utf-8;",
        });

        const fileName = `${getFormattedDate()}_당일거래량상위.csv`;
        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.setAttribute("download", fileName);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        log(
          ` -> 통합 CSV 다운로드 완료: [${fileName}] (총 ${dataList.length}건)`,
          "success",
        );
      }

      // 실행 통합 워크플로우
      async function executeWorkflow() {
        const btn = document.getElementById("runBtn");
        const badge = document.getElementById("statusBadge");

        btn.disabled = true;
        btn.classList.add("opacity-50", "cursor-not-allowed");
        badge.textContent = "처리 중";
        badge.className =
          "px-2 py-0.5 text-[10px] rounded bg-amber-500/20 text-amber-300 font-medium";

        resetLog();

        try {
          // 1초 대기 후 토큰 발급
          await delay(1000);

          const authParams = {
            grant_type: "client_credentials",
            appkey: "6C5DEgrFBmeUtnQ6dwYFazZ_Aa3Tdia3agcS6rTkmic",
            secretkey: "xl5sKBl168QCieYJHAW7IgI-aefHGlD4txRCts-__CM",
          };

          const token = await fn_au10001(authParams);

          // 1초 대기 후 코스피 수집
          log(" -> 1초 대기 후 코스피 수집을 시작합니다...");
          await delay(1000);
          const kospiData = await collectMarketData(token, "001", "k");

          // 1초 대기 후 코스닥 수집
          log(" -> 1초 대기 후 코스닥 수집을 시작합니다...");
          await delay(1000);
          const kosdaqData = await collectMarketData(token, "101", "q");

          // 데이터 병합 (코스피 + 코스닥)
          const totalList = kospiData.concat(kosdaqData);

          if (totalList.length > 0) {
            log(
              ` -> 전체 수집 완료: 총 ${totalList.length}건 (코스피: ${kospiData.length}건 / 코스닥: ${kosdaqData.length}건)`,
              "success",
            );

            // 1초 대기 후 CSV 저장
            log(" -> 1초 대기 후 CSV 파일을 생성합니다...");
            await delay(1000);

            createAndDownloadCSV(totalList);
            badge.textContent = "완료";
            badge.className =
              "px-2 py-0.5 text-[10px] rounded bg-emerald-500/20 text-emerald-300 font-medium";
          } else {
            log(" -> 수집된 데이터가 존재하지 않습니다.", "warn");
            badge.textContent = "데이터 없음";
            badge.className =
              "px-2 py-0.5 text-[10px] rounded bg-slate-800 text-slate-400";
          }
        } catch (err) {
          log(`오류가 발생했습니다: ${err.message}`, "error");
          badge.textContent = "오류";
          badge.className =
            "px-2 py-0.5 text-[10px] rounded bg-red-500/20 text-red-300 font-medium";
        } finally {
          btn.disabled = false;
          btn.classList.remove("opacity-50", "cursor-not-allowed");
        }
      }
    </script>
  </body>
</html>
