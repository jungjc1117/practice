<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>키움증권 종목별대차거래추이 CSV 다운로드</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4"
  >
    <!-- Main Container -->
    <div
      class="max-w-xl w-full bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden"
    >
      <!-- Header -->
      <div
        class="bg-slate-800/80 p-6 border-b border-slate-700 flex items-center space-x-4"
      >
        <div
          class="p-3 bg-red-600/20 border border-red-500/30 rounded-xl text-red-500"
        >
          <i data-lucide="file-spread-sheet" class="w-8 h-8"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white">
            종목별대차거래추이 CSV 다운로더
          </h1>
          <p class="text-xs text-slate-400 mt-1">
            동일 폴더의 stk_base.csv 기반 자동 조율 및 데이터 추출
          </p>
        </div>
      </div>

      <!-- Main Content Body -->
      <div class="p-6 space-y-6">
        <div>
          <label
            for="searchStartDateInput"
            class="block text-xs font-semibold text-slate-300 mb-2"
          >
            시작 일자 (YYYYMMDD)
          </label>
          <input
            type="text"
            id="searchStartDateInput"
            maxlength="8"
            placeholder="예: 20260101"
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 font-mono text-sm"
          />
        </div>
        <div>
          <label
            for="searchEndDateInput"
            class="block text-xs font-semibold text-slate-300 mb-2"
          >
            종료 일자 (YYYYMMDD)
          </label>
          <input
            type="text"
            id="searchEndDateInput"
            maxlength="8"
            placeholder="예: 20261231"
            class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500 font-mono text-sm"
          />
        </div>

        <!-- Execution Button -->
        <div>
          <button
            id="runBtn"
            onclick="executeWorkflow()"
            class="w-full py-4 px-6 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 active:scale-[0.99] text-white font-bold text-base rounded-xl shadow-lg shadow-red-900/30 transition-all flex items-center justify-center space-x-3 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <i data-lucide="download" class="w-5 h-5"></i>
            <span>종목별대차거래추이 CSV 다운로드</span>
          </button>
        </div>

        <!-- Progress Indicator -->
        <div id="progressContainer" class="hidden space-y-1.5">
          <div
            class="flex justify-between text-[11px] text-slate-400 font-mono"
          >
            <span id="progressText">진행률: 0 / 0</span>
            <span id="progressPercent">0%</span>
          </div>
          <div
            class="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-800"
          >
            <div
              id="progressBar"
              class="bg-gradient-to-r from-red-500 to-emerald-400 h-full w-0 transition-all duration-300"
            ></div>
          </div>
        </div>

        <!-- Log / Status Box -->
        <div
          class="bg-slate-950 rounded-xl border border-slate-800 p-4 font-mono text-xs text-slate-300"
        >
          <div
            class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800"
          >
            <span
              class="text-slate-400 font-semibold flex items-center space-x-2"
            >
              <i data-lucide="terminal" class="w-4 h-4 text-emerald-400"></i>
              <span>실행 상태 로그</span>
            </span>
            <span
              id="statusBadge"
              class="px-2 py-0.5 text-[10px] rounded bg-slate-800 text-slate-400 border border-slate-700"
              >대기 중</span
            >
          </div>
          <div
            id="logArea"
            class="h-60 overflow-y-auto space-y-1.5 text-[11px] leading-relaxed"
          >
            <div class="text-slate-500">
              '종목별대차거래추이 CSV 다운로드' 버튼을 누르면 `./stk_base.csv`
              파일에서 종목코드를 불러와 입력된 기간 조회를 진행합니다.
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
      // Initialize Lucide Icons
      lucide.createIcons();

      // Utility: Get YYYYMMDD Format
      function getFormattedDate(dateObj = new Date()) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, "0");
        const day = String(dateObj.getDate()).padStart(2, "0");
        return `${year}${month}${day}`;
      }

      // 페이지 로드 시 시작일자(금년 1월 1일), 종료일자(오늘) 기본 세팅
      const today = new Date();
      const firstDayOfYear = new Date(today.getFullYear(), 0, 1);
      document.getElementById("searchStartDateInput").value =
        getFormattedDate(firstDayOfYear);
      document.getElementById("searchEndDateInput").value =
        getFormattedDate(today);

      // Fixed rate-limiting delay (1000ms)
      const FIXED_DELAY_MS = 1000;
      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      // Terminal Logging Function
      function log(msg, type = "info") {
        const logArea = document.getElementById("logArea");
        const entry = document.createElement("div");
        const now = new Date().toLocaleTimeString();

        let color = "text-slate-300";
        if (type === "error") color = "text-red-400 font-semibold";
        if (type === "success") color = "text-emerald-400 font-semibold";
        if (type === "warn") color = "text-amber-400";

        entry.className = color;
        entry.innerHTML = `<span class="text-slate-600">[${now}]</span> ${msg}`;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
        console.log(msg);
      }

      function resetLog() {
        document.getElementById("logArea").innerHTML = "";
      }

      // Fetch and parse stk_base.csv from same folder
      async function loadStkBaseCSV() {
        log("`./stk_base.csv` 파일 읽는 중...");
        try {
          const response = await fetch("./stk_base.csv", { cache: "no-cache" });
          if (!response.ok) {
            throw new Error(
              `stk_base.csv 파일을 찾을 수 없습니다. (상태 코드: ${response.status})`,
            );
          }
          const text = await response.text();
          const stockCodes = parseStkBaseCSV(text);

          if (stockCodes.length === 0) {
            throw new Error(
              "stk_base.csv 내에서 유효한 종목코드를 추출하지 못했습니다.",
            );
          }

          log(
            ` -> \`./stk_base.csv\` 읽기 완료: 총 ${stockCodes.length}개 종목코드 추출됨. (${stockCodes.join(", ")})`,
            "success",
          );
          return stockCodes;
        } catch (err) {
          log(` -> stk_base.csv 로드 실패: ${err.message}`, "error");
          throw err;
        }
      }

      // Extract raw stock codes preserving original formats like "005930_AL"
      function parseStkBaseCSV(csvText) {
        const lines = csvText.split(/\r?\n/);
        const stockCodes = [];
        let stkCdColIdx = -1;

        if (lines.length > 0) {
          const headers = lines[0]
            .split(",")
            .map((h) => h.trim().replace(/^["']|["']$/g, ""));
          stkCdColIdx = headers.indexOf("stk_cd");
        }

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          // Skip header row
          if (i === 0 && stkCdColIdx !== -1) continue;

          const cols = line
            .split(",")
            .map((c) => c.trim().replace(/^["']|["']$/g, ""));

          let rawCode = "";
          if (stkCdColIdx !== -1 && cols[stkCdColIdx]) {
            rawCode = cols[stkCdColIdx];
          } else if (cols.length > 0) {
            rawCode = cols[0];
          }

          if (rawCode && !stockCodes.includes(rawCode)) {
            stockCodes.push(rawCode);
          }
        }

        return stockCodes;
      }

      // 1. Access Token Request (fn_au10001)
      async function fn_au10001(data) {
        const host = "https://mockapi.kiwoom.com";
        const endpoint = "/oauth2/token";
        const url = host + endpoint;

        const headers = {
          "Content-Type": "application/json;charset=UTF-8",
        };

        log("1. 접근토큰 발급 요청 중...");

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: headers,
            body: JSON.stringify(data),
          });

          const responseBody = await response.json();

          const code = responseBody.return_code;
          if (
            code !== undefined &&
            code !== 0 &&
            code !== "0" &&
            code !== "0000"
          ) {
            throw new Error(
              responseBody.return_msg || responseBody.msg || "토큰 발급 실패",
            );
          }

          const token = responseBody.access_token || responseBody.token;
          if (token) {
            log(" -> 접근토큰 발급 성공!", "success");
            return token;
          } else {
            throw new Error("응답 바디에 Access Token이 없습니다.");
          }
        } catch (error) {
          console.error("요청 실패:", error);
          log(` -> 토큰 발급 실패: ${error.message}`, "error");
          throw error;
        }
      }

      // 2. Dbrt Trading TR Request (fn_ka20068)
      async function fn_ka20068(token, data, cont_yn = "N", next_key = "") {
        const host = "https://mockapi.kiwoom.com";
        const endpoint = "/api/dostk/slb";
        const url = host + endpoint;

        const headers = {
          "Content-Type": "application/json;charset=UTF-8",
          authorization: `Bearer ${token}`,
          "cont-yn": cont_yn,
          "next-key": next_key,
          "api-id": "ka20068",
        };

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: headers,
            body: JSON.stringify(data),
          });

          const resContYn =
            response.headers.get("cont-yn") ||
            response.headers.get("Cont-Yn") ||
            "N";
          const resNextKey =
            response.headers.get("next-key") ||
            response.headers.get("Next-Key") ||
            "";

          const responseBody = await response.json();

          const code = responseBody.return_code;
          if (
            code !== undefined &&
            code !== 0 &&
            code !== "0" &&
            code !== "0000"
          ) {
            throw new Error(
              responseBody.return_msg ||
                responseBody.msg ||
                "TR 데이터 조회 실패",
            );
          }

          return {
            body: responseBody,
            contYn: resContYn,
            nextKey: resNextKey,
          };
        } catch (error) {
          console.error("요청 실패:", error);
          log(` -> TR 요청 실패: ${error.message}`, "error");
          throw error;
        }
      }

      // Collect data sequentially per stock code
      async function collectDbrtData(token, stk_cd, startDate, endDate) {
        log(
          `\n--- [종목코드: ${stk_cd} (조회기간: ${startDate} ~ ${endDate})] 수집 시작 ---`,
          "warn",
        );

        // API 사양에 맞추어 시작/종료 일자를 전달하도록 구성
        const baseTrParams = {
          stk_cd: stk_cd,
          amt_qty_tp: "2", // 1:금액, 2:수량
          strt_dt: startDate,
          end_dt: endDate,
          dt: endDate, // 대화형 단일 일자 조회 파라미터 호환성 대비
        };

        let stockDbrtList = [];
        let contYn = "N";
        let nextKey = "";
        let page = 1;

        while (true) {
          log(`[${stk_cd}] 데이터 요청 중... (${page}번째 페이지)`);
          const result = await fn_ka20068(token, baseTrParams, contYn, nextKey);

          const pageList = result.body.dbrt_trde_trnsn || [];

          // 원본 종목코드(stk_cd)를 응답 항목 데이터에 바인딩
          const formattedList = pageList.map((item) => ({
            ...item,
            stk_cd: item.stk_cd || stk_cd,
          }));

          stockDbrtList = stockDbrtList.concat(formattedList);

          log(
            ` -> [${stk_cd}] ${page}페이지 수신완료: ${pageList.length}건 (누적: ${stockDbrtList.length}건)`,
            "success",
          );

          contYn = result.contYn;
          nextKey = result.nextKey;

          if (contYn !== "Y" || !nextKey) {
            log(
              ` -> [${stk_cd}] 추가 데이터가 없으므로 조회를 완료합니다.`,
              "info",
            );
            break;
          }

          page++;
          log(` -> 1초 대기 후 [${stk_cd}] 다음 연속조회를 실행합니다...`);
          await delay(FIXED_DELAY_MS);
        }

        return stockDbrtList;
      }

      // 마이너스/부호 중복 정제 함수 (e.g., "--151071" -> "-151071")
      function cleanQuantityValue(val) {
        if (val === undefined || val === null) return "";
        let strVal = String(val).trim();
        if (!strVal) return "";
        const isNegative = strVal.includes("-");
        const cleanDigits = strVal.replace(/[^0-9]/g, "");
        return isNegative ? `-${cleanDigits}` : cleanDigits;
      }

      // Create and Download Consolidated CSV
      function createAndDownloadCSV(dataList, startDate, endDate) {
        log("\nCSV 변환 및 다운로드 실행 중...");

        const headers = ["dt", "stk_cd", "dbrt_trde_irds"];
        let csvRows = [headers.join(",")];

        dataList.forEach((item) => {
          const dtVal = (item.dt || "").replace(/"/g, '""');
          const stkCdVal = (item.stk_cd || "").replace(/"/g, '""');
          const dbrtVal = item.dbrt_trde_irds.replace(/"/g, '""');

          const row = [`"${dtVal}"`, `"${stkCdVal}"`, `"${dbrtVal}"`];
          csvRows.push(row.join(","));
        });

        // UTF-8 BOM for Excel Korean encoding compatibility
        const csvContent = "\uFEFF" + csvRows.join("\r\n");
        const blob = new Blob([csvContent], {
          type: "text/csv;charset=utf-8;",
        });

        const fileName = `${startDate}_${endDate}_종목별대차거래추이.csv`;
        const url = URL.createObjectURL(blob);

        const link = document.createElement("a");
        link.href = url;
        link.setAttribute("download", fileName);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        log(
          ` -> 통합 CSV 다운로드 완료: [${fileName}] (총 ${dataList.length}건)`,
          "success",
        );
      }

      // Main Workflow
      async function executeWorkflow() {
        const btn = document.getElementById("runBtn");
        const badge = document.getElementById("statusBadge");
        const progressContainer = document.getElementById("progressContainer");
        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");
        const progressPercent = document.getElementById("progressPercent");

        const startDateInput = document
          .getElementById("searchStartDateInput")
          .value.trim();
        const endDateInput = document
          .getElementById("searchEndDateInput")
          .value.trim();

        // 날짜 유효성 검사 (8자리 숫자)
        if (!/^\d{8}$/.test(startDateInput) || !/^\d{8}$/.test(endDateInput)) {
          alert("조회 일자를 YYYYMMDD 형태의 8자리 숫자로 입력해주세요.");
          return;
        }

        if (startDateInput > endDateInput) {
          alert("시작 일자가 종료 일자보다 나중일 수 없습니다.");
          return;
        }

        btn.disabled = true;
        badge.textContent = "처리 중";
        badge.className =
          "px-2 py-0.5 text-[10px] rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 font-medium";

        resetLog();

        try {
          // 1. Fetch and parse stock codes from ./stk_base.csv
          const stockCodes = await loadStkBaseCSV();

          progressContainer.classList.remove("hidden");
          progressBar.style.width = "0%";
          progressText.textContent = `진행률: 0 / ${stockCodes.length}`;
          progressPercent.textContent = "0%";

          await delay(500);

          // 2. Kiwoom OAuth Token Request
          const authParams = {
            grant_type: "client_credentials",
            appkey: "6C5DEgrFBmeUtnQ6dwYFazZ_Aa3Tdia3agcS6rTkmic",
            secretkey: "xl5sKBl168QCieYJHAW7IgI-aefHGlD4txRCts-__CM",
          };

          const token = await fn_au10001(authParams);

          let totalList = [];
          const totalCodes = stockCodes.length;

          // 3. Sequential data collection per stock code
          for (let index = 0; index < totalCodes; index++) {
            const stk_cd = stockCodes[index];
            const currentStep = index + 1;

            log(
              ` -> [${currentStep}/${totalCodes}] 종목 [${stk_cd}] 수집 진행 중...`,
            );

            const stockData = await collectDbrtData(
              token,
              stk_cd,
              startDateInput,
              endDateInput,
            );
            totalList = totalList.concat(stockData);

            // Progress UI update
            const percent = Math.round((currentStep / totalCodes) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `진행률: ${currentStep} / ${totalCodes} (현재: ${stk_cd})`;
            progressPercent.textContent = `${percent}%`;

            if (index < totalCodes - 1) {
              log(` -> 1초 대기 후 다음 종목을 수집합니다...`);
              await delay(FIXED_DELAY_MS);
            }
          }

          // 4. Final Aggregated CSV Export
          if (totalList.length > 0) {
            log(
              `\n전체 수집 완료: 총 ${totalList.length}건 수집됨.`,
              "success",
            );
            await delay(500);

            createAndDownloadCSV(totalList, startDateInput, endDateInput);
            badge.textContent = "완료";
            badge.className =
              "px-2 py-0.5 text-[10px] rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-medium";
          } else {
            log(" -> 수집된 데이터가 존재하지 않습니다.", "warn");
            badge.textContent = "데이터 없음";
            badge.className =
              "px-2 py-0.5 text-[10px] rounded bg-slate-800 text-slate-400 border border-slate-700";
          }
        } catch (err) {
          log(`오류 발생: ${err.message}`, "error");
          badge.textContent = "오류";
          badge.className =
            "px-2 py-0.5 text-[10px] rounded bg-red-500/20 text-red-300 border border-red-500/30 font-medium";
        } finally {
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
